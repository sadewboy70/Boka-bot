<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCT-MD · Groups & Chats (Owner Only)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#020204; --purple:#7B2CBF; --cyan:#00F5FF; --pink:#FF3D9A; }
  * { font-family:'Plus Jakarta Sans',sans-serif; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  .mono { font-family:'JetBrains Mono',monospace; }
  html, body { background:var(--bg); color:#fff; min-height:100vh; min-height:100dvh; }
  body { position:relative; overflow-x:hidden; padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }

  .grid-overlay { position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image: linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
      background-size: 38px 38px;
      -webkit-mask-image: radial-gradient(ellipse 95% 65% at 50% 0%, #000 25%, transparent 88%);
      mask-image: radial-gradient(ellipse 95% 65% at 50% 0%, #000 25%, transparent 88%);
  }
  .glow { position:fixed; z-index:0; pointer-events:none; border-radius:9999px; filter:blur(110px); animation: float 12s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(20px,25px); } }

  .card { position:relative; z-index:1; background:rgba(255,255,255,0.022); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px); border:1px solid rgba(255,255,255,0.075); border-radius:18px; box-shadow: 0 25px 60px -25px rgba(0,0,0,0.9), inset 0 1px 1px rgba(255,255,255,0.035); }
  .icon-badge { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:14px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); }
  .avatar-ring { width:96px; height:96px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 50% 30%, rgba(0,245,255,0.16), transparent 70%); border:2px solid rgba(0,245,255,0.4); box-shadow:0 0 0 6px rgba(0,245,255,0.05), 0 0 40px -6px rgba(0,245,255,0.35); overflow:hidden; }

  .btn { border-radius:11px; padding:9px 15px; font-weight:700; font-size:12px; transition:.15s; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; border:none; }
  .btn:active { transform: scale(0.96); }
  .btn-cyan { background:linear-gradient(90deg,var(--cyan),#00c2ff); color:#001a1d; box-shadow:0 8px 20px rgba(0,245,255,0.14); }
  .btn-cyan:hover { filter:brightness(1.1); }
  .btn-outline { border:1px solid rgba(255,255,255,0.15); color:#ddd; background:rgba(255,255,255,0.02); }
  .btn-outline:hover { border-color:var(--cyan); color:var(--cyan); }

  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
  .dot-on { background:#00FF87; box-shadow:0 0 10px #00FF87; }
  .dot-off { background:#555; }

  input, select { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.1); color:#fff; border-radius:10px; padding:9px 12px; font-size:12px; width:100%; }
  input:focus, select:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(0,245,255,0.08); }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:4px; }
</style>
</head>
<body class="p-4 md:p-8">

<div class="grid-overlay"></div>
<div class="glow w-[340px] h-[340px] bg-purple-600/12 top-[-70px] left-[-70px]"></div>
<div class="glow w-[340px] h-[340px] bg-cyan-500/12 top-[-70px] right-[-70px]" style="animation-delay:-5s"></div>

<div class="max-w-2xl mx-auto relative z-10">

  <!-- Admin key gate -->
  <div id="gate" class="card p-7 max-w-sm mx-auto mt-16 text-center">
    <div class="avatar-ring mx-auto mb-5">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg>
    </div>
    <p class="text-sm font-bold mb-1">Owner Access Only</p>
    <p class="text-[11px] text-white/40 mb-4">Same ADMIN_KEY dashboard.html eke use karana eka danna.</p>
    <input id="adminKeyInput" type="password" placeholder="Enter ADMIN_KEY" class="w-full mb-3 text-center rounded-full" style="height:46px;" onkeydown="if(event.key==='Enter') unlock()">
    <button id="unlockBtn" onclick="unlock()" class="btn btn-cyan w-full rounded-full" style="height:48px;">Unlock</button>
    <p id="gateError" class="text-[11px] text-red-400 mt-3 hidden"></p>
  </div>

  <!-- Main -->
  <div id="dashboard" class="hidden">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-2.5">
        <div class="icon-badge" style="width:36px;height:36px;border-radius:11px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div>
        <div>
          <h1 class="text-base font-extrabold mono">Groups <span style="color:var(--cyan)">&amp; Chats</span></h1>
          <p class="text-[10px] text-white/35 uppercase tracking-wider">Owner Only</p>
        </div>
      </div>
      <a href="/dashboard" class="btn btn-outline text-[10px]">← Dashboard</a>
    </div>

    <div class="card p-5 mb-4">
      <label class="block text-[10px] font-bold text-white/45 uppercase tracking-wider mb-1.5">Select Session (Bot Number)</label>
      <div class="flex gap-2">
        <select id="sessionSelect" class="flex-1"></select>
        <button onclick="loadGroupsChats()" class="btn btn-cyan text-[10px]">Load</button>
      </div>
      <p id="sessionMsg" class="text-[11px] mt-2 hidden"></p>
    </div>

    <div id="resultsCard" class="card p-5 hidden">
      <div class="flex gap-2 mb-4">
        <button id="tabGroupsBtn" onclick="switchTab('groups')" class="btn btn-cyan text-[10px] flex-1">Groups (<span id="groupCountBadge">0</span>)</button>
        <button id="tabChatsBtn" onclick="switchTab('chats')" class="btn btn-outline text-[10px] flex-1">Recent Chats (<span id="chatCountBadge">0</span>)</button>
      </div>
      <div id="listEl" class="space-y-2" style="max-height:440px;overflow-y:auto;"></div>
      <p id="listEmpty" class="text-center text-white/30 text-xs py-6 hidden"></p>
    </div>
  </div>
</div>

<script>
let adminKey = sessionStorage.getItem('dct_admin_key') || '';
let currentNumber = '';
let data = { groups: [], chats: [] };
let activeTab = 'groups';
let openComposerJid = null;

async function api(path, opts = {}) {
  opts.headers = Object.assign({ 'Content-Type': 'application/json', 'x-admin-key': adminKey }, opts.headers || {});
  const r = await fetch(path, opts);
  return r.json().catch(() => ({ success:false, error:'Bad response' }));
}

async function unlock() {
  adminKey = document.getElementById('adminKeyInput').value.trim();
  const btn = document.getElementById('unlockBtn');
  const errEl = document.getElementById('gateError');
  errEl.classList.add('hidden');
  if (!adminKey) { errEl.innerText = 'Admin key ekk danna.'; errEl.classList.remove('hidden'); return; }
  btn.disabled = true; btn.innerText = 'Checking…';
  const res = await api('/api/sessions/list');
  btn.disabled = false; btn.innerText = 'Unlock';
  if (!res.success) {
    errEl.innerText = res.error || 'Wrong ADMIN_KEY.';
    errEl.classList.remove('hidden');
    return;
  }
  sessionStorage.setItem('dct_admin_key', adminKey);
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  populateSessions(res.sessions || []);
}

function populateSessions(sessions) {
  const sel = document.getElementById('sessionSelect');
  sel.innerHTML = '';
  const connected = sessions.filter(s => s.connected);
  if (!connected.length) {
    sel.innerHTML = '<option value="">-- No connected sessions --</option>';
    return;
  }
  connected.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.number;
    opt.innerText = '+' + s.number + ' (online)';
    sel.appendChild(opt);
  });
}

async function loadGroupsChats() {
  currentNumber = document.getElementById('sessionSelect').value;
  const msgEl = document.getElementById('sessionMsg');
  const resultsCard = document.getElementById('resultsCard');
  if (!currentNumber) { msgEl.innerText = 'Session ekak select karanna.'; msgEl.className = 'text-[11px] mt-2 text-red-400'; msgEl.classList.remove('hidden'); return; }
  msgEl.classList.add('hidden');
  resultsCard.classList.remove('hidden');
  document.getElementById('listEl').innerHTML = '<p class="text-center text-white/30 text-xs py-4">Loading...</p>';
  const res = await api('/api/admin/chats?number=' + encodeURIComponent(currentNumber));
  if (!res.success) {
    resultsCard.classList.add('hidden');
    msgEl.innerText = res.error || 'Failed to load.';
    msgEl.className = 'text-[11px] mt-2 text-red-400';
    msgEl.classList.remove('hidden');
    return;
  }
  data = { groups: res.groups || [], chats: res.chats || [] };
  document.getElementById('groupCountBadge').innerText = data.groups.length;
  document.getElementById('chatCountBadge').innerText = data.chats.length;
  renderList();
}

function switchTab(tab) {
  activeTab = tab; openComposerJid = null;
  document.getElementById('tabGroupsBtn').className = 'btn text-[10px] flex-1 ' + (tab === 'groups' ? 'btn-cyan' : 'btn-outline');
  document.getElementById('tabChatsBtn').className = 'btn text-[10px] flex-1 ' + (tab === 'chats' ? 'btn-cyan' : 'btn-outline');
  renderList();
}

function renderList() {
  const listEl = document.getElementById('listEl');
  const emptyEl = document.getElementById('listEmpty');
  const items = activeTab === 'groups' ? data.groups : data.chats;
  listEl.innerHTML = '';
  if (!items.length) {
    emptyEl.innerText = activeTab === 'groups' ? 'Group ekakat join wela na.' : 'Innamath chat ekak nathi.';
    emptyEl.classList.remove('hidden');
    return;
  }
  emptyEl.classList.add('hidden');
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'p-3 rounded-xl cursor-pointer';
    row.style.cssText = 'background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);';
    const infoHtml = activeTab === 'groups'
      ? `<div class="min-w-0"><p class="text-xs font-bold truncate">${esc(it.name)}</p><p class="text-[10px] text-white/35">${it.participants} members${it.isAdmin ? ' • you are admin' : ''}</p></div>`
      : `<div class="min-w-0 flex-1"><p class="text-xs font-bold truncate">${esc(it.name)}${it.isGroup ? ' 👥' : ''}</p><p class="text-[10px] text-white/35 truncate">${it.fromMe ? 'You: ' : ''}${esc(it.lastMsg || '')}</p></div><span class="text-[9px] text-white/25 ml-2 flex-shrink-0">${timeAgo(it.ts)}</span>`;
    const header = document.createElement('div');
    header.className = 'flex items-center justify-between';
    header.innerHTML = infoHtml;
    header.onclick = () => { openComposerJid = (openComposerJid === it.jid) ? null : it.jid; renderList(); };
    row.appendChild(header);

    if (openComposerJid === it.jid) {
      const composer = document.createElement('div');
      composer.className = 'mt-3 pt-3 flex gap-2';
      composer.style.cssText = 'border-top:1px solid rgba(255,255,255,0.06);';
      composer.onclick = (e) => e.stopPropagation();
      composer.innerHTML = `<input type="text" placeholder="Message eka liyanna..." class="flex-1 text-xs" id="in_${safe(it.jid)}" style="height:38px;" onkeydown="if(event.key==='Enter') sendMsg('${it.jid}')">
        <button class="btn btn-cyan text-[10px]" style="height:38px;" onclick="sendMsg('${it.jid}')">Send</button>`;
      row.appendChild(composer);
      const p = document.createElement('p'); p.id = `msg_${safe(it.jid)}`; p.className = 'text-[10px] mt-2';
      row.appendChild(p);
    }
    listEl.appendChild(row);
  });
}

function safe(s) { return (s || '').replace(/[^a-zA-Z0-9]/g, '_'); }
function esc(s) { const d = document.createElement('div'); d.innerText = s || ''; return d.innerHTML; }
function timeAgo(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  return Math.floor(s / 86400) + 'd';
}

async function sendMsg(jid) {
  const input = document.getElementById(`in_${safe(jid)}`);
  const msgEl = document.getElementById(`msg_${safe(jid)}`);
  const text = (input?.value || '').trim();
  if (!text) return;
  input.disabled = true;
  const res = await api('/api/admin/send-message', { method: 'POST', body: JSON.stringify({ number: currentNumber, jid, text }) });
  input.disabled = false;
  if (res.success) {
    input.value = '';
    if (msgEl) { msgEl.className = 'text-[10px] mt-2 text-green-400'; msgEl.innerText = '✅ Sent'; }
    if (activeTab === 'chats') loadGroupsChats();
  } else {
    if (msgEl) { msgEl.className = 'text-[10px] mt-2 text-red-400'; msgEl.innerText = '❌ ' + (res.error || 'Failed'); }
  }
}

(async function boot() {
  if (!adminKey) return;
  const res = await api('/api/sessions/list');
  if (res.success) {
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    populateSessions(res.sessions || []);
  }
})();
</script>
</body>
</html>
